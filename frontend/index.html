<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="#">
                Expense Tracker
            </a>

        </div>
    </nav>


    <!-- MAIN CONTAINER -->
    <div class="container my-4">

        <!-- ALERT -->
        <div id="alertContainer"></div>


        <!-- LOADING -->
        <div
            id="loading"
            class="text-center d-none mb-3"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            >
                <span class="visually-hidden">
                    Loading...
                </span>
            </div>

            <p class="mt-2">
                Loading...
            </p>

        </div>


        <!-- SUMMARY CARDS -->
        <div class="summary-cards mb-4">

            <!-- Total Amount -->
            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Total Amount
                    </h5>

                    <h2
                        id="totalAmount"
                        class="text-primary"
                    >
                        0.00
                    </h2>

                </div>

            </div>


            <!-- Number of Expenses -->
            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Number of Expenses
                    </h5>

                    <h2
                        id="expenseCount"
                        class="text-success"
                    >
                        0
                    </h2>

                </div>

            </div>


            <!-- Highest Expense -->
            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title">
                        Highest Expense
                    </h5>

                    <h2
                        id="highestExpense"
                        class="text-danger"
                    >
                        0.00
                    </h2>

                </div>

            </div>

        </div>


        <!-- ADD EXPENSE FORM -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <h4 class="card-title mb-4">
                    Add Expense
                </h4>


                <form id="expenseForm">

                    <div class="row g-3">

                        <!-- Title -->
                        <div class="col-md-6">

                            <label
                                for="title"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter expense title"
                                required
                            >

                        </div>


                        <!-- Amount -->
                        <div class="col-md-6">

                            <label
                                for="amount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                id="amount"
                                class="form-control"
                                placeholder="Enter amount"
                                min="0.01"
                                step="0.01"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="col-md-6">

                            <label
                                for="category"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->
                        <div class="col-md-6">

                            <label
                                for="date"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="date"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Submit -->
                        <div class="col-12">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Add Expense
                            </button>

                        </div>

                    </div>

                </form>

            </div>

        </div>


        <!-- FILTER -->
        <div class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row align-items-center">

                    <div class="col-md-4">

                        <label
                            for="categoryFilter"
                            class="form-label"
                        >
                            Filter by Category
                        </label>

                        <select
                            id="categoryFilter"
                            class="form-select"
                        >

                            <option value="All">
                                All
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>


        <!-- EXPENSE TABLE -->
        <div class="card shadow-sm">

            <div class="card-body">

                <h4 class="card-title mb-4">
                    Expenses
                </h4>


                <div class="table-responsive">

                    <table class="table table-striped table-hover">

                        <thead class="table-dark">

                            <tr>

                                <th>
                                    Title
                                </th>

                                <th>
                                    Amount
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Date
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="expenseTableBody">

                            <!-- JavaScript will add rows here -->

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <!-- EDIT EXPENSE MODAL -->
    <div
        class="modal fade"
        id="editExpenseModal"
        tabindex="-1"
        aria-labelledby="editExpenseModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="editExpenseModalLabel"
                    >
                        Edit Expense
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- Modal Body -->
                <div class="modal-body">

                    <form id="editExpenseForm">

                        <!-- Hidden ID -->
                        <input
                            type="hidden"
                            id="editExpenseId"
                        >


                        <!-- Title -->
                        <div class="mb-3">

                            <label
                                for="editTitle"
                                class="form-label"
                            >
                                Title
                            </label>

                            <input
                                type="text"
                                id="editTitle"
                                class="form-control"
                                required
                            >

                        </div>


                        <!-- Amount -->
                        <div class="mb-3">

                            <label
                                for="editAmount"
                                class="form-label"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                id="editAmount"
                                class="form-control"
                                min="0.01"
                                step="0.01"
                                required
                            >

                        </div>


                        <!-- Category -->
                        <div class="mb-3">

                            <label
                                for="editCategory"
                                class="form-label"
                            >
                                Category
                            </label>

                            <select
                                id="editCategory"
                                class="form-select"
                                required
                            >

                                <option value="Food">
                                    Food
                                </option>

                                <option value="Transport">
                                    Transport
                                </option>

                                <option value="Bills">
                                    Bills
                                </option>

                                <option value="Entertainment">
                                    Entertainment
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Date -->
                        <div class="mb-3">

                            <label
                                for="editDate"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="editDate"
                                class="form-control"
                                required
                            >

                        </div>

                    </form>

                </div>


                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        form="editExpenseForm"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- APP JS -->
    <script src="js/app.js"></script>

</body>

</html>
